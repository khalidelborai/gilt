[package]
name = "gilt-derive"
version = "0.11.3"
edition = "2021"
description = "Derive macros for the gilt terminal formatting library"
license = "MIT"
readme = "README.md"
repository = "https://github.com/khalidelborai/gilt"
homepage = "https://github.com/khalidelborai/gilt"
documentation = "https://docs.rs/gilt-derive"
keywords = ["terminal", "rich", "derive", "macro"]
categories = ["command-line-interface"]
rust-version = "1.82.0"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
# Compile-fail / compile-pass tests for the derive macros.
trybuild = "1"
# Snapshot tests for generated code stability.
insta = { version = "1", features = ["yaml"] }
# We test the derives by exercising them on real types; that needs the
# main gilt crate (which in turn re-exports our derives via its `derive`
# feature gate).
gilt = { path = "../..", features = ["derive"] }
