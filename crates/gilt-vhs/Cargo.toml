[package]
name = "gilt-vhs"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false
description = "Tape-as-code: scripted asciinema .cast + SVG generation for gilt README demos."

[dependencies]
gilt = { path = "../..", features = ["asciinema"] }

[dev-dependencies]
serde_json = "1"

[lib]
name = "gilt_vhs"
path = "src/lib.rs"
